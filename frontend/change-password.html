<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .password-container {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .btn-change {
            width: 100%;
            padding: 12px;
            background: #E63946;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .toggle-eye {
            position: absolute;
            right: 12px;
            top: 40px;
            cursor: pointer;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="password-container">
        <h2 style="text-align: center; color: #1D3557; margin-bottom: 25px;">Đổi mật khẩu</h2>

        <form id="changePassForm">
            <div class="form-group">
                <label>Mật khẩu hiện tại</label>
                <input type="password" id="oldPass" required>
                <i class="fas fa-eye toggle-eye" onclick="togglePass('oldPass', this)"></i>
            </div>

            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="newPass" required>
                <i class="fas fa-eye toggle-eye" onclick="togglePass('newPass', this)"></i>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" id="confirmPass" required>
            </div>

            <button type="submit" class="btn-change">Cập nhật mật khẩu</button>
        </form>
        <a href="index.html"
            style="display:block; text-align:center; margin-top:20px; text-decoration:none; color:#666;">Hủy bỏ</a>
    </div>

    <script>
        const BASE_URL = "window.location.origin/api";

        document.getElementById('changePassForm').onsubmit = async (e) => {
            e.preventDefault();
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const user = JSON.parse(localStorage.getItem('user'));

            if (newPass !== confirmPass) {
                alert("Mật khẩu mới và xác nhận không khớp!");
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/auth/change-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: user.email,
                        oldPass: oldPass,
                        newPass: newPass
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    alert("Đổi mật khẩu thành công! Vui lòng đăng nhập lại.");
                    localStorage.removeItem('user'); // Bắt đăng nhập lại cho an toàn
                    window.location.href = 'index.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Lỗi kết nối server!");
            }
        };

        function togglePass(id, icon) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>
</body>

</html>

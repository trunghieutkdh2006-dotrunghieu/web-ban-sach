<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Cài đặt tài khoản</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .settings-container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .setting-info h4 {
            margin: 0;
            color: #1D3557;
        }

        .setting-info p {
            margin: 5px 0 0;
            font-size: 13px;
            color: #777;
        }

        /* Nút gạt (Switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #1D3557;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .btn-save-settings {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #E63946;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #457B9D;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="settings-container">
        <h2><i class="fas fa-cog"></i> Cài đặt hệ thống</h2>

        <div class="setting-item">
            <div class="setting-info">
                <h4>Thông báo Email</h4>
                <p>Nhận thông báo về đơn hàng và sách mới qua email.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="notifyEmail" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <div class="setting-info">
                <h4>Chế độ tối (Dark Mode)</h4>
                <p>Thay đổi giao diện sang màu tối để bảo vệ mắt.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="darkMode">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <div class="setting-info">
                <h4>Công khai hồ sơ</h4>
                <p>Cho phép người khác tìm thấy hồ sơ của bạn.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="publicProfile">
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn-save-settings" onclick="saveSettings()">Lưu cài đặt</button>
        <a href="index.html" class="back-link">Quay lại trang chủ</a>
    </div>

    <script>
        // Load cài đặt đã lưu
        window.onload = () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const settings = JSON.parse(localStorage.getItem('appSettings')) || {};
            if (settings.notifyEmail !== undefined) document.getElementById('notifyEmail').checked = settings.notifyEmail;
            if (settings.darkMode !== undefined) document.getElementById('darkMode').checked = settings.darkMode;
            if (settings.publicProfile !== undefined) document.getElementById('publicProfile').checked = settings.publicProfile;
            applyDarkMode(settings.darkMode);
        };

        function applyDarkMode(enabled) {
            if (enabled) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        function saveSettings() {
            const settings = {
                notifyEmail: document.getElementById('notifyEmail').checked,
                darkMode: document.getElementById('darkMode').checked,
                publicProfile: document.getElementById('publicProfile').checked
            };

            localStorage.setItem('appSettings', JSON.stringify(settings));
            applyDarkMode(settings.darkMode);
            alert("Cài đặt đã được lưu thành công!");
        }
    </script>
</body>

</html>
